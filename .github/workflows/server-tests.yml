name: Backend CI

on:
    push:
        branches: [uat, prod]
        paths-ignore:
            - "**.css"
            - "**.js"
            - "**.md"
            - "**.html"
            - "**.csv"
            - "**.po"
            - "**.pot"
env:
    CRM_BRANCH: ${{ github.base_ref || github.ref_name }}

concurrency:
    group: backend-${{ github.event.number || github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Tests
        runs-on: ubuntu-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false

        services:
            mysql:
                image: mariadb:10.6
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

        steps:
            - name: Clone
              uses: actions/checkout@v6

            - name: Setup environment
              uses: ./.github/actions/setup-server-env
              with:
                  python-version: "3.10"
                  node-version: "24"
                  type: "server"

            - name: Run server tests
              uses: ./.github/actions/run-server-tests
              with:
                  bench-path: "/home/runner/frappe-bench"
                  site: "test_site"
                  app: "crm"
                  enable-coverage: "true"
                  type: "server"
                  ci-build-id: ${{ github.run_id }}
            # TATVA: stripped the coverage-artifact upload + the "Coverage Wrap Up" job that uploaded
            # to Codecov (external service). Tests still run and gate; no coverage data leaves CI.
