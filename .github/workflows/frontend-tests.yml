name: Frontend

on:
    push:
        branches: [develop, tatva]
        paths-ignore:
            - "**.md"
            - "**.py"
            - "**.txt"
            - "**.csv"
            - "**.po"
            - "**.pot"
            - ".github/workflows/server-tests.yml"
            - ".github/workflows/builds.yml"
    schedule:
        # Weekly — Saturday 22:00 IST (16:30 UTC)
        - cron: "30 16 * * 6"
    workflow_dispatch:

concurrency:
    group: frontend-${{ github.event.number || github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: yarn
                  cache-dependency-path: frontend/yarn.lock

            - name: Install dependencies
              run: cd frontend && yarn install --frozen-lockfile

            - name: ESLint
              run: cd frontend && npx eslint src --ext .js,.ts,.vue

            - name: Oxlint
              run: cd frontend && npx oxlint src

    test:
        name: Unit Tests & Coverage
        runs-on: ubuntu-latest
        needs: lint

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: yarn
                  cache-dependency-path: frontend/yarn.lock

            - name: Run frontend tests
              uses: ./.github/actions/frontend-tests
              with:
                  node-version: "24"
                  enable-coverage: "true"
            # TATVA: stripped the coverage-artifact upload + the "Coverage Wrap Up" job that uploaded
            # to Codecov (external service). Tests still run and gate; no coverage data leaves CI.
